services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: jobalert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: jobalert
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobalert -d jobalert"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ./config:/app/config:ro
    restart: unless-stopped

volumes:
  pgdata:
